name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: MCP server answers tools/list
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | TURNSIGNAL_TOKEN=ci-check node packages/turnsignal/dist/cli.js mcp | tee out.txt
          grep -q turnsignal_recent_runs out.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t turnsignal-mcp .
      - name: MCP server in Docker answers tools/list
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm -e TURNSIGNAL_TOKEN=ci-check turnsignal-mcp | tee out.txt
          grep -q turnsignal_flaky_tests out.txt
